version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grokbuildcsharp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_csharp:/var/lib/postgresql/data
volumes:
  postgres_data_csharp:
